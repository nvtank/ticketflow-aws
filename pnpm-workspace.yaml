packages:
  - apps/*
  - packages/*

# Nest CLI 11 pins webpack 5.106.2. New schema-utils 4.8 requires a newer
# webpack peer; keep the compatible stable 4.3 line until the CLI updates.
overrides:
  'schema-utils@^4.0.0': 4.3.3

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - '@nestjs/core'
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
