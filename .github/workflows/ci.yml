name: Local quality checks

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose --env-file .env.example -f infrastructure/docker-compose.yml config --quiet
      - run: pnpm --filter @tixflow/shared build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec vitest run
      - run: pnpm test:infra:up
      - run: pnpm test:db:prepare
      - run: pnpm --filter @tixflow/api test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - run: pnpm exec playwright test --config playwright.auth.config.ts
      - run: pnpm exec playwright test --config playwright.events.config.ts
      - run: pnpm exec playwright test --config playwright.booking.config.ts
      - run: pnpm test:infra:down
        if: always()
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
